<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Counter</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #19243a;
      background: #f5f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, #e5edff 0, transparent 48%),
        #f5f7fb;
    }

    .counter-card {
      width: min(100%, 420px);
      padding: 36px;
      text-align: center;
      background: #fff;
      border: 1px solid #e6eaf2;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgb(35 52 92 / 10%);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #64718a;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 2.65rem);
      letter-spacing: -.06em;
    }

    .count {
      display: grid;
      min-height: 180px;
      place-items: center;
      margin: 22px 0;
      color: #315be8;
      font-size: clamp(5rem, 24vw, 8rem);
      font-weight: 750;
      letter-spacing: -.08em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid #9cb2ff; outline-offset: 3px; }

    .step {
      color: #315be8;
      background: #edf1ff;
      font-size: 1.5rem;
    }

    .step:hover { background: #e1e8ff; }

    .reset {
      color: #fff;
      background: #315be8;
      box-shadow: 0 8px 18px rgb(49 91 232 / 20%);
    }

    .reset:hover { background: #254bd0; }

    .hint {
      margin: 22px 0 0;
      color: #7a8498;
      font-size: .88rem;
    }

    @media (max-width: 420px) {
      .counter-card { padding: 28px 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="counter-card" aria-labelledby="title">
    <p class="eyebrow">A little app</p>
    <h1 id="title">Counter</h1>
    <output class="count" id="count" aria-live="polite" aria-atomic="true">0</output>
    <div class="controls" aria-label="Counter controls">
      <button class="step" id="decrement" type="button" aria-label="Decrease count">−</button>
      <button class="reset" id="reset" type="button">Reset</button>
      <button class="step" id="increment" type="button" aria-label="Increase count">+</button>
    </div>
    <p class="hint">Tap + or − to change the count.</p>
  </main>

  <script>
    const countDisplay = document.querySelector('#count');
    let count = 0;

    function renderCount() {
      countDisplay.textContent = count;
    }

    document.querySelector('#increment').addEventListener('click', () => {
      count += 1;
      renderCount();
    });

    document.querySelector('#decrement').addEventListener('click', () => {
      count -= 1;
      renderCount();
    });

    document.querySelector('#reset').addEventListener('click', () => {
      count = 0;
      renderCount();
    });
  </script>
</body>
</html>
